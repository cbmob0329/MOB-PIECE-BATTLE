const rr={R:1,SR:2,SSR:3,UR:4,MOB:5}, cr={"シードソウル":1,"ミドルソウル":2,"MOBソウル":3};
function render(){
 let q=document.getElementById('q').value.toLowerCase(), rar=document.getElementById('rar').value,
 cls=document.getElementById('cls').value, attr=document.getElementById('attr').value, sort=document.getElementById('sort').value;
 let a=data.filter(x=>(!rar||x.rarity===rar)&&(!cls||x.soulClass===cls)&&(!attr||x.attribute.includes(attr))&&
 (!q||[x.name,x.skillName,x.skillEffect,x.tags.join(" "),x.fusionA,x.fusionB,x.special].join(" ").toLowerCase().includes(q)));
 a.sort((x,y)=>{
   if(sort==="rarity") return rr[y.rarity]-rr[x.rarity]||x.name.localeCompare(y.name,"ja");
   if(sort==="class") return cr[y.soulClass]-cr[x.soulClass]||rr[y.rarity]-rr[x.rarity];
   if(sort==="attribute") return x.attribute.localeCompare(y.attribute,"ja")||x.name.localeCompare(y.name,"ja");
   if(sort==="tag") return (x.tags[0]||"").localeCompare(y.tags[0]||"","ja")||x.name.localeCompare(y.name,"ja");
   if(sort==="atk") return y.ATK-x.ATK;
   if(sort==="def") return y.DEF-x.DEF;
   return x.name.localeCompare(y.name,"ja");
 });
 document.getElementById('meta').textContent=`表示 ${a.length} / ${data.length}体`;
 document.getElementById('body').innerHTML=a.map(x=>`<tr>
 <td class="${x.rarity==="MOB"?"mob":""}">${x.name}</td><td>${x.rarity}</td><td>${x.soulClass}</td><td>${x.attribute}</td>
 <td class=num>${x.ATK}</td><td class=num>${x.DEF}</td>
 <td>${x.tags.map(t=>`<span class=badge>${t}</span>`).join("")}</td>
 <td class=skill><b>${x.skillName}</b><br><small>${x.skillTiming}</small><br>${x.skillEffect}</td>
 <td class=fusion>${[x.fusionA,x.fusionB].filter(Boolean).join("<br>")}</td>
 <td class="fusion special">${x.special}</td><td>${x.imagePath}</td></tr>`).join("");
}
["q","rar","cls","attr","sort"].forEach(id=>document.getElementById(id).addEventListener("input",render)); render();
</script></body></html>
