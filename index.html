<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183d3c">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23193b39%22/%3E%3Ctext x=%226%22 y=%2224%22 fill=%22%23f7f3e8%22 font-size=%2224%22 font-family=%22sans-serif%22%3EM%3C/text%3E%3C/svg%3E">
  <title>MOB PIECE BATTLE</title>
  <link rel="stylesheet" href="./src/styles/game.css?v=6.1.0">
  <style>
    #mpb-boot-guard{position:fixed;inset:0;z-index:99999;background:#173331;color:#f7f3e8;display:grid;place-items:center;font-family:Arial,'Yu Gothic',sans-serif;padding:24px;text-align:center}
    #mpb-boot-guard>div{width:min(340px,88vw)}#mpb-boot-guard b{font-size:22px;letter-spacing:.04em}#mpb-boot-guard p{font-size:12px;opacity:.8;line-height:1.7;margin-bottom:10px}.mpb-loadbar{height:9px;border:1px solid #f7f3e875;border-radius:999px;overflow:hidden;background:#0f2927;margin:12px 0 7px}.mpb-loadbar i{display:block;width:6%;height:100%;background:#f0c85d;transition:width .18s ease}.mpb-progress{display:block;font-size:9px;letter-spacing:.08em;opacity:.72}.mpb-boot-failed code{display:block;margin:12px 0;padding:10px;background:#0f2927;border-radius:8px;font-size:10px;word-break:break-all}.mpb-boot-failed button{border:0;border-radius:8px;padding:10px 18px;font-weight:800;background:#f0c85d;color:#173331}
    html[data-mpb-ready="1"] #mpb-boot-guard{display:none}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="mpb-boot-guard"><div><b>MOB PIECE BATTLE</b><p id="mpb-load-label">UI素材を読み込んでいます</p><div class="mpb-loadbar"><i id="mpb-load-progress"></i></div><span class="mpb-progress" id="mpb-load-count">STARTING...</span></div></div>
  <script>
    (function(){
      var guard=document.getElementById('mpb-boot-guard'),bar=document.getElementById('mpb-load-progress'),count=document.getElementById('mpb-load-count'),label=document.getElementById('mpb-load-label');
      window.mpbBootProgress=function(done,total,text){var p=total?Math.round(done/total*100):0;if(bar)bar.style.width=Math.max(6,p)+'%';if(count)count.textContent=done+' / '+total+' · '+p+'%';if(label&&text)label.textContent=text+' を読み込んでいます';};
      function fail(message){if(document.documentElement.dataset.mpbReady==='1')return;document.documentElement.dataset.mpbReady='error';guard.className='mpb-boot-failed';guard.innerHTML='<div><b>起動エラー</b><p>読み込みに失敗しました。キャッシュではなくエラー内容を表示しています。</p><code>'+String(message||'UNKNOWN_ERROR').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];})+'</code><button onclick="location.reload()">再読み込み</button></div>';}
      window.addEventListener('error',function(e){if(e && e.message)fail(e.message+' @ '+(e.filename||'')+':'+(e.lineno||''));});
      window.addEventListener('unhandledrejection',function(e){fail(e && e.reason ? (e.reason.message||e.reason) : 'PROMISE_REJECTION');});
      window.addEventListener('mpb:ready',function(){document.documentElement.dataset.mpbReady='1';});
      setTimeout(function(){if(document.documentElement.dataset.mpbReady!=='1')fail('BOOT_TIMEOUT_v6.1.0');},15000);
    })();
  </script>
  <script type="module" src="./src/app.js?v=6.1.0"></script>
</body>
</html>
